name: Mini Foundation Checks
on:
  push:
    branches: ['feat/**', 'main']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/static-check.mjs
      - run: node --test tests/*.test.mjs
      - run: cd cloudflare && node --test test/*.test.mjs
      - run: cd cloudflare && npm run build
      - run: node --check cloudflare/dist/worker.mjs
